[package]
name = "odra-casper-signing"
description = "Collects the signatures of a Casper transaction made on several machines (multisig)."

authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
readme = "README.md"
repository = { workspace = true }
version = { workspace = true }

[dependencies]
# casper-types only, without a network stack, so cargo-odra can use it as well as odra-cli.
casper-types = { workspace = true, features = ["std"] }
odra-casper-account-manager = { workspace = true }
serde_json = { workspace = true, features = ["std"] }
thiserror = { workspace = true }

[lints.rust]
missing_docs = "warn"
