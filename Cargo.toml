[workspace]
exclude = [
  "odra-casper/proxy-caller",
  "templates/blank",
  "templates/full",
  "templates/workspace",
  "tests",
]
members = [
  "benchmark",
  "core",
  "examples",
  "examples/ourcoin",
  "modules",
  "odra",
  "odra-bdd",
  "odra-build",
  "odra-casper/livenet-env",
  "odra-casper/rpc-client",
  "odra-casper/test-vm",
  "odra-casper/wasm-env",
  "odra-cli",
  "odra-macros",
  "odra-schema",
  "odra-test",
  "odra-vm",
  "odra-wasm-client",
  "odra-wasm-client-builder",
]
resolver = "2"

[workspace.package]
authors = [
  "Jakub Płaskonka <kuba@odra.dev>",
  "Krzysztof Pobiarżyn <krzysztof@odra.dev>",
  "Maciej Zieliński <maciej@odra.dev>",
]
edition = "2021"
homepage = "https://odra.dev/docs"
license = "MIT"
readme = "README.md"
repository = "https://github.com/odradev/odra"
version = "2.9.1"

[workspace.dependencies]
odra-casper-rpc-client = { path = "odra-casper/rpc-client", version = "2.9.1" }
odra-casper-test-vm = { path = "odra-casper/test-vm", version = "2.9.1" }
odra-casper-wasm-env = { path = "odra-casper/wasm-env", version = "2.9.1" }
odra-core = { path = "core", version = "2.9.1" }
odra-macros = { path = "odra-macros", version = "2.9.1" }
odra-schema = { path = "odra-schema", version = "2.9.1" }
odra-vm = { path = "odra-vm", version = "2.9.1" }
odra-wasm-client = { path = "odra-wasm-client", version = "2.9.1" }

casper-client = { version = "5.0.1", default-features = false }
casper-contract = { version = "5.1", default-features = false }
casper-contract-schema = { version = "0.7.0" }
casper-engine-test-support = "9.0"
casper-event-standard = "0.7"
casper-execution-engine = "9.0"
casper-storage = "5.0"
casper-types = "7.0"

anyhow = { version = "1.0", default-features = false }
backtrace = { version = "0.3" }
base16 = { version = "0.2", default-features = false }
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
blake2 = "0.10"
bytes = "1.11"
chrono = { version = "0.4"}
clap = { version = "4.5"}
convert_case = "0.6"
cucumber = "0.21"
derive-try-from-ref = "0.1"
derive_more = { version = "2.1.0", features = ["full"] }
dotenv = "0.15"
futures = "0.3"
futures-util = "0.3"
gloo-utils = { version = "0.2"}
hex = "0.4"
itertools = "0.14"
js-sys = "0.3"
lazy_static = "1.5.0"
log = "0.4"
mockall = { version = "0.14" }
num-traits = { version = "0.2", default-features = false }
pretty_assertions = "1.4"
prettycli = "0.1"
proc-macro2 = "1.0"
project-root = "0.2"
quote = "1.0"
rand = { version = "0.9", default-features = false }
rand_chacha = { version = "0.9", default-features = false }
reqwest = { version = "0.12" }
reqwest-eventsource = { version = "0.6" }
rustyline = "14"
serde = { version = "1.0", default-features = false }
serde_derive = {  version = "1.0" }
serde-json-wasm = { version = "1.0", default-features = false }
serde_json = { version = "1.0", default-features = false }
sha3 = { version = "0.10", default-features = false }
tempfile = "3"
shlex = "1"
syn = "2.0"
syn_derive = "0.2"
thiserror = "1.0"
tokio = "1.48"
toml = "0.9"
wasm-bindgen = "=0.2.100"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3"}


[profile.release]
codegen-units = 1
lto = true

[profile.dev.package."*"]
opt-level = 3

# Casper 2.x addressable-entity stack. The old published crates (casper-storage
# 2.1.1 / EE 8.1.1) cannot run with enable_addressable_entity - genesis ignores
# the flag and lazy migration mis-files system contract named keys. The types 7 /
# storage 5 / EE 9 stack fixes this.
#
# What casper-node still needs to publish (re-checked 2026-09-14, unchanged):
#   published on crates.io: casper-types 7.0.0, casper-storage 5.0.0,
#     casper-execution-engine 9.0.0 (these compose correctly).
#   MISSING: casper-engine-test-support >= 9.0.0 (latest release is still 8.1.1,
#     2025-07-09, requiring types ^6.0.1 / storage ^2.1.1 / EE ^8.1.1), and a
#     casper-contract release requiring casper-types 7 (latest is still 5.1.1,
#     2025-07-09, requiring casper-types ^6.0.1).
#
# Because casper-engine-test-support must come from git and its manifest uses
# in-repo path deps on types/storage/EE/contract, those siblings are pulled from
# the same git rev - and cargo will not unify a crates.io copy with a git copy of
# the same crate. So ALL five casper-node crates stay patched to the pinned git
# rev until BOTH missing crates above are published; patching only test-support
# would duplicate casper-types and fail to compile. Once they ship, delete the
# five git lines and use plain "7"/"5"/"9"/... version requirements.
#
# casper-event-standard is ours, and stays patched to its feature/casper-types-7
# branch: it cannot be published yet. It needs casper-contract on wasm32, and
# published casper-contract 5.1.1 requires casper-types ^6, so a consumer
# without this patch block would get casper-types 6 and 7 in one graph and fail
# to compile with mismatched casper_types:: paths. Blocked on the same
# casper-contract release as above.
#
# casper-contract-schema was the other one and is now PUBLISHED as 0.7.0
# (2026-09-14, requiring casper-types 7), so its patch line is gone and it
# resolves from crates.io normally.
#
# When bumping a patched crate's version, keep the requirement above in step
# with it: if the patched source no longer satisfies the requirement, cargo only
# WARNS ("patch ... was not used in the crate graph"), silently falls back to the
# crates.io copy and pulls a second casper-types into the build.
#
# casper-client no longer needs a branch: crates.io 5.0.1 (2026-03-16) requires
# casper-types ^7.0.0, and the workspace compiles against it.
[patch.crates-io]
casper-types = { git = "https://github.com/casper-network/casper-node", rev = "6e6621ca4fcb77ab69c0a6f7e52d2dd7f1c41cea" }
casper-storage = { git = "https://github.com/casper-network/casper-node", rev = "6e6621ca4fcb77ab69c0a6f7e52d2dd7f1c41cea" }
casper-execution-engine = { git = "https://github.com/casper-network/casper-node", rev = "6e6621ca4fcb77ab69c0a6f7e52d2dd7f1c41cea" }
casper-engine-test-support = { git = "https://github.com/casper-network/casper-node", rev = "6e6621ca4fcb77ab69c0a6f7e52d2dd7f1c41cea" }
casper-contract = { git = "https://github.com/casper-network/casper-node", rev = "6e6621ca4fcb77ab69c0a6f7e52d2dd7f1c41cea" }
casper-event-standard = { git = "https://github.com/odradev/casper-event-standard", branch = "feature/casper-types-7" }
