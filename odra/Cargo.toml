[package]
name = "odra"
description = "Smart contracts for Casper Network."

authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[dependencies]
odra-core = { workspace = true }
odra-macros = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
odra-schema = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
odra-casper-wasm-env = { workspace = true }

[lints.rust]
missing_docs = "warn"

[features]
default = []
disable-allocator = ["odra-casper-wasm-env/disable-allocator"]
# Makes `ContractEnv::debug` print from wasm (casper_print). For the test VM; production wasm should not carry it.
test-support = ["odra-casper-wasm-env/test-support"]
