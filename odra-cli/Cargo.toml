[package]
name = "odra-cli"
description = "Odra CLI - Command Line Interface for Odra smart contracts."

authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[dependencies]
odra = { path = "../odra", version = "2.7.2", default-features = false }
odra-casper-livenet-env = { path = "../odra-casper/livenet-env", version = "2.7.2" }

anyhow = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
clap = { workspace = true, features = ["cargo", "derive", "string"] }
hex = { workspace = true }
pretty_assertions = { workspace = true }
prettycli = { workspace = true }
project-root = { workspace = true }
serde = { workspace = true, default-features = false }
serde_derive = { workspace = true, features = ["default"] }
serde_json = { workspace = true, default-features = false }
thiserror = { workspace = true }
toml = { workspace = true }

[build-dependencies]
odra-build = { path = "../odra-build", version = "2.7.2", default-features = false }
