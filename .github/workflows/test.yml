name: Tests
on:
  pull_request:
    branches-ignore:
      - 'hotfix/**'
    paths-ignore:
      - '**.md'
  push:
    branches:
      - 'release/**'
    paths-ignore:
      - '**.md'
run-name: Running lints and tests for ${{ github.head_ref }}

# The suite is split into independent jobs so the OdraVM tests (no wasm needed) report in minutes
# while the wasm-based ones build. Every job restores the same cache and saves under its own key.
jobs:
  deny:
    name: Dependency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: extractions/setup-just@v1
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/.fingerprint
            target/debug/build
          key: odra-cache-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            odra-cache-lint-
            odra-cache-
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-01
          target: wasm32-unknown-unknown
          components: rustfmt, clippy, rust-src
      - name: Set key for speculative execution
        run: echo "WASM_CLIENT_SK=${{ secrets.CLIENT_SK }}" >> $GITHUB_ENV
      - name: Run lints
        run: just check-lint

  odra-vm:
    name: OdraVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: extractions/setup-just@v1
      - name: Set key for speculative execution
        run: echo "WASM_CLIENT_SK=${{ secrets.CLIENT_SK }}" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/.fingerprint
            target/debug/build
          key: odra-cache-odra-vm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            odra-cache-odra-vm-
            odra-cache-
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-01
          target: wasm32-unknown-unknown
          components: rust-src
      - name: Install cargo-odra
        run: just install-cargo-odra
      - name: Run OdraVM tests
        run: just test-odra test-modules-on-odravm test-examples-on-odravm

  casper-vm:
    name: CasperVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: extractions/setup-just@v1
      - name: Set key for speculative execution
        run: echo "WASM_CLIENT_SK=${{ secrets.CLIENT_SK }}" >> $GITHUB_ENV
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/.fingerprint
            target/debug/build
          key: odra-cache-casper-vm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            odra-cache-casper-vm-
            odra-cache-
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-01
          target: wasm32-unknown-unknown
          components: rust-src
      - name: Prepare test environment
        run: just prepare-test-env
      - name: Run CasperVM tests
        run: just test-modules-on-casper test-examples-on-casper

  livenet:
    name: Livenet tests (NCTL)
    runs-on: ubuntu-latest
    services:
      casper-nctl:
        image: makesoftware/casper-nctl:v203
        options: --name mynctl
        env:
          PREDEFINED_ACCOUNTS: 'true'
          MINIMUM_ROUND_EXPONENT: '12'
          MAXIMUM_ROUND_EXPONENT: '14'
          DEPLOY_DELAY: '30sec'
        ports:
          - 11101:11101
          - 18101:18101
    steps:
      - uses: extractions/setup-just@v1
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/.fingerprint
            target/debug/build
          key: odra-cache-livenet-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            odra-cache-livenet-
            odra-cache-
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-01
          target: wasm32-unknown-unknown
          components: rust-src
      - name: Prepare test environment
        run: just prepare-test-env
      - name: Build the wasm files
        run: just build-livenet-wasm
      - name: Run livenet tests
        run: just test-livenet
