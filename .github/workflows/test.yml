name: Tests
on:
  pull_request:
    branches-ignore:
      - 'hotfix/**'
    paths-ignore:
      - '**.md'
  push:
    branches:
      - 'release/**'
    paths-ignore:
      - '**.md'
run-name: Running lints and tests for ${{ github.head_ref }}

# The suite is split into independent jobs so the OdraVM tests (no wasm needed) report in minutes
# while the wasm-based ones build.
#
# Every job restores its compiled dependencies and the cargo binaries it installs (cargo-odra,
# grcov) with rust-cache under its own `shared-key`. A cache saved from a PR branch is visible to
# that branch only, so the caches are saved from the release branches, which every PR can read.
jobs:
  deny:
    name: Dependency check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run cargo-deny
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: extractions/setup-just@v1
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-01
          target: wasm32-unknown-unknown
          components: rustfmt, clippy, rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.event_name == 'push' }}
      - name: Set key for speculative execution
        run: echo "WASM_CLIENT_SK=${{ secrets.CLIENT_SK }}" >> $GITHUB_ENV
      - name: Run lints
        run: just check-lint

  # The OdraVM suite runs instrumented for coverage, so one run is both the test gate and the
  # source of the coverage report, instead of a second, uninstrumented run of the same tests.
  odra-vm:
    name: OdraVM tests
    runs-on: ubuntu-latest
    steps:
      - uses: extractions/setup-just@v1
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-01
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: odra-vm
          save-if: ${{ github.event_name == 'push' }}
      - name: Set key for speculative execution
        run: echo "WASM_CLIENT_SK=${{ secrets.CLIENT_SK }}" >> $GITHUB_ENV
      - name: Install grcov
        run: just install-grcov
      - name: Run OdraVM tests with coverage
        run: just coverage
      - name: Upload coverage report
        uses: codecov/codecov-action@v3
        with:
          files: target/coverage/*.lcov

  # One job per suite, so the two run on separate runners: the examples suite alone is three
  # times the modules suite.
  casper-vm:
    name: CasperVM tests (${{ matrix.suite }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [modules, examples]
    # Contracts build in parallel (cargo-odra release/0.2.1); on the 4 CPUs of a runner four jobs finish
    # in a third of the time of one. Each job past the first keeps its dependencies in a target
    # directory of its own under target/cargo-odra, about 250 MB each in the cache.
    env:
      CARGO_ODRA_JOBS: 4
    steps:
      - uses: extractions/setup-just@v1
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-01
          target: wasm32-unknown-unknown
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: casper-vm-${{ matrix.suite }}
          save-if: ${{ github.event_name == 'push' }}
      # rust-cache prunes ~/.cargo/registry/src before saving, and cargo re-extracts the crates from
      # their archives on restore. casper-engine-test-support generates resources/chainspec.toml
      # into its own source dir from build.rs, and that build script is cached as fresh, so the
      # generated file would be missing at test run time. Cleaning the crate forces the rerun.
      - name: Regenerate the casper-engine-test-support chainspec
        run: cargo clean -p casper-engine-test-support
      - name: Set key for speculative execution
        run: echo "WASM_CLIENT_SK=${{ secrets.CLIENT_SK }}" >> $GITHUB_ENV
      - name: Prepare test environment
        run: just prepare-test-env
      - name: Run CasperVM tests
        run: just test-${{ matrix.suite }}-on-casper

  livenet:
    name: Livenet tests (NCTL)
    runs-on: ubuntu-latest
    env:
      CARGO_ODRA_JOBS: 4
    services:
      casper-nctl:
        image: makesoftware/casper-nctl:v203
        options: --name mynctl
        env:
          PREDEFINED_ACCOUNTS: 'true'
          MINIMUM_ROUND_EXPONENT: '12'
          MAXIMUM_ROUND_EXPONENT: '14'
          DEPLOY_DELAY: '30sec'
        ports:
          - 11101:11101
          - 18101:18101
    steps:
      - uses: extractions/setup-just@v1
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-01
          target: wasm32-unknown-unknown
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: livenet
          save-if: ${{ github.event_name == 'push' }}
      - name: Prepare test environment
        run: just prepare-test-env
      # The committed schemas are checked by the Schemas workflow; regenerating them here would
      # take longer than the wasm build itself.
      - name: Build the wasm files
        run: just build-livenet-wasm --skip-schema
      - name: Run livenet tests
        run: just test-livenet
