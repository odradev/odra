name: Evaluate benchmark

on:
  pull_request:
    branches-ignore:
      - 'hotfix/**'
    paths-ignore:
      - '**.md'

run-name: Evaluating benchmark for ${{ github.head_ref }}

jobs:
  evaluate-benchmark:
    name: Evaluate benchmark
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Setup just
        uses: extractions/setup-just@v1
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-01
          target: wasm32-unknown-unknown
      - name: Cache target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/debug/.fingerprint
            target/debug/build
          key: odra-cache
      - name: Prepare test environment
        run: just prepare-test-env
      - name: Set base benchmark filename
        id: set-benchmark-filename
        run: echo "BASE_BENCHMARK=${GITHUB_BASE_REF}" | sed 's:/:-:g' | sed 's:\.:-:g' >> $GITHUB_OUTPUT
      # A base branch without a benchmark run (e.g. the base of a stacked PR) has no report to
      # compare against: warn and skip the evaluation instead of failing the job.
      - name: Download base benchmark report for ${{ github.base_ref }}
        id: download-base-benchmark
        uses: dawidd6/action-download-artifact@v27
        with:
          name: ${{ steps.set-benchmark-filename.outputs.BASE_BENCHMARK }}
          branch: ${{ github.base_ref }}
          workflow: benchmark.yml
          path: benchmark/base/
          if_no_artifact_found: warn
      - name: Skip evaluation without a base benchmark report
        if: steps.download-base-benchmark.outputs.found_artifact != 'true'
        run: echo "::notice::No benchmark report for ${{ github.base_ref }}, the benchmark is not evaluated."
      - name: Evaluate benchmark
        id: evaluate-benchmark
        if: steps.download-base-benchmark.outputs.found_artifact == 'true'
        run: |
          set +e
          just evaluate-benchmark
          echo "EXIT_CODE=$?" >> $GITHUB_OUTPUT
        continue-on-error: true
      - name: Create comment
        uses: peter-evans/create-or-update-comment@v4
        if: steps.evaluate-benchmark.outcome == 'success' && steps.evaluate-benchmark.outputs.EXIT_CODE != '0'
        with:
          issue-number: ${{ github.event.number }}
          body-path: benchmark/benchmark_report.txt
      - name: Upload full report artifact
        if: steps.evaluate-benchmark.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmark/benchmark_full_report.txt
