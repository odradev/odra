name: Benchmark

# Produces the gas report a pull request is compared against (see evaluate-benchmark.yml), so it
# only needs to run where PRs are based: the release branches. `workflow_dispatch` covers the rest.
on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

run-name: Benchmarking gas costs for ${{ github.head_ref || github.ref_name }}

jobs:
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    steps:
      - name: Setup just
        uses: extractions/setup-just@v1
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-01
          target: wasm32-unknown-unknown
      # Saved from the release branches, this cache also serves evaluate-benchmark.yml.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: benchmark
      # rust-cache prunes ~/.cargo/registry/src before saving, and cargo re-extracts the crates from
      # their archives on restore. casper-engine-test-support generates resources/chainspec.toml
      # into its own source dir from build.rs, and that build script is cached as fresh, so the
      # generated file would be missing at test run time. Cleaning the crate forces the rerun.
      - name: Regenerate the casper-engine-test-support chainspec
        run: cargo clean -p casper-engine-test-support
      - name: Prepare test environment
        run: just prepare-test-env
      - name: Run benchmark
        run: just benchmark
      - name: Set benchmark filename
        run: echo "BENCHMARK_FILENAME=${GITHUB_REF_NAME}" | sed 's:/:-:g' | sed 's:\.:-:g' >> $GITHUB_ENV
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BENCHMARK_FILENAME }}
          path: benchmark/gas_report.json
