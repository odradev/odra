name: Schemas
on:
  pull_request:
    branches-ignore:
      - 'hotfix/**'
    paths:
      - 'core/**'
      - 'odra/**'
      - 'odra-build/**'
      - 'odra-macros/**'
      - 'odra-schema/**'
      - 'modules/**'
      - 'examples/**'
      - 'Cargo.toml'
      - 'rust-toolchain'
      - 'justfile'
      - '.github/workflows/check-schemas.yml'
  push:
    branches:
      - 'release/**'
run-name: Checking the committed schemas for ${{ github.head_ref }}

# Generating the schemas builds the contract crate once per contract, which takes far longer than
# the tests, so this runs as its own workflow, only when the code the schemas are generated from
# changes.
jobs:
  check-schemas:
    name: Committed schemas are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: extractions/setup-just@v1
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-01-01
          target: wasm32-unknown-unknown
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: schemas
          save-if: ${{ github.event_name == 'push' }}
      - name: Install cargo-odra
        run: just install-cargo-odra
      - name: Check the committed schemas are up to date
        run: just check-schemas
