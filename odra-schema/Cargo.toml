[package]
name = "odra-schema"
description = "Generates Casper Contract Schema from Odra contracts."

authors = { workspace = true }
edition = { workspace = true }
homepage = { workspace = true }
license = { workspace = true }
readme = { workspace = true }
repository = { workspace = true }
version = { workspace = true }

[dependencies]
odra-core = { workspace = true }

casper-contract-schema = { workspace = true }
casper-types = { workspace = true }

base64 = { workspace = true }
blake2 = { workspace = true }
convert_case = { workspace = true }
hex = { workspace = true }
num-traits = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std", "preserve_order"], optional = true }
thiserror = { workspace = true, optional = true }

[features]
# Conversions between values, bytes and text for tools like odra-cli and odra-storage-reader.
# Off by default: the schema is compiled by every contract.
codec = ["dep:serde_json", "dep:thiserror"]

[dev-dependencies]
serde_json = { workspace = true }

[lints.rust]
missing_docs = "warn"
