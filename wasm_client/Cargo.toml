[package]
name = "wasm-client"
description = "Wasm client"
edition = "2021"

[dependencies]
odra-wasm-client = { path = "../odra-wasm-client" }
casper-types = "6.0.0"
odra-core = { path = "../core" }
serde = { version = "1.0.195", default-features = false }
serde_json = { version = "1.0.113", default-features = false }
# serde-wasm-bindgen = "0.6.5"
# js-sys = "0.3.77"
# futures-channel = "0.3.31"

[lib]
crate-type = ["cdylib", "rlib"]
name = "wasm_client"
path = "src/lib.rs"