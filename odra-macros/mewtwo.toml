[mewtwo]
# The library only: the tests compile the macros' output, so a mutant whose expansion does
# not compile fails the test command and counts as killed, not unviable.
build-command = "cargo build -p odra-macros"
test-all-command = "cargo test -p odra-macros"
test-one-command = "cargo test -p odra-macros -- --exact TEST_NAME"

